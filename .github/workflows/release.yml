name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: contains(matrix.target, 'linux')
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          name="claude-nonstop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/claude-nonstop" LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: claude-nonstop-*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release notes
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p=index($0,"["v"]")>0} p' CHANGELOG.md > notes.md
      - run: cat dist/*.sha256 > dist/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*
        env:
          GH_TOKEN: ${{ github.token }}
      - name: check whether this version is on crates.io
        id: crate
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "claude-nonstop-release" "https://crates.io/api/v1/crates/claude-nonstop/${GITHUB_REF_NAME#v}")
          echo "published=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.crate.outputs.published == 'false'
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crate.outputs.published == 'false'
        id: auth
      - run: cargo publish --locked
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
